name: Daily Agent Checker

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  run-agent:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Daily Agent
      run: npx playwright test tests/e2e/daily-agent.spec.ts
      env:
        # Define any env vars needed
        E2E_BASE_URL: https://airahost.com
    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-error-report
        path: |
          agent_error_report.md
          screenshot-*.png
          playwright-report/
        retention-days: 7
